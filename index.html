<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090807">
<meta name="description" content="Hey World — an immersive journey through Mars, Earth, and Venus.">
<title>Hey World</title>
<style>

@font-face{font-family:'SF Pro';src:local('SF Pro'),local('SF Pro Display Regular');font-weight:400;font-display:swap}
@font-face{font-family:'SF Pro';src:local('SF Pro Bold'),local('SF Pro Display Bold');font-weight:700;font-display:swap}
@font-face{font-family:'SF Pro Thin';src:local('SF Pro Thin'),local('SF Pro Display Thin');font-weight:100;font-display:swap}
@font-face{font-family:Aalto;src:local('Aalto');font-weight:400;font-display:swap}
:root{font-family:'SF Pro',Arial,sans-serif;color:#fff;background:#090807;font-synthesis:none}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden}
.experience{position:relative;width:100%;height:100%;min-height:540px;overflow:hidden;background:#0a0908}
.backgrounds,.background,.shade,.transition-layer,.transition-layer video{position:absolute;inset:0;width:100%;height:100%}
.background{object-fit:cover;opacity:0;transition:opacity .8s ease} .background.is-visible{opacity:1}
.shade{z-index:1;background:linear-gradient(to bottom,transparent 52%,rgba(0,0,0,.88) 100%);pointer-events:none}
.chrome{position:absolute;z-index:4;transition:opacity .45s ease,filter .45s ease}
.experience.is-transitioning .chrome{opacity:0;filter:blur(8px);pointer-events:none}

.header{left:clamp(18px,1.95vw,28px);right:clamp(18px,1.95vw,28px);top:clamp(18px,3.1vh,28px);display:flex;justify-content:space-between;align-items:center}
        .header-actions{margin-left:auto;display:flex;align-items:center}
        .nav{display:flex;align-items:center;height:42px;padding:4px 5px;border:1px solid rgba(255,255,255,.45);
             background:rgba(255,255,255,.1);backdrop-filter:blur(12px);border-radius:999px}
        .nav a{color:#fff;text-decoration:none;padding:8px 19px;border-radius:999px;line-height:1}
        .nav a.active{background:#fff;color:#000}
        .menu{height:42px;padding:0 20px;border:0;border-radius:999px;background:#fff;color:#000;cursor:pointer}

.planet-list{left:clamp(18px,1.95vw,28px);top:50%;transform:translateY(-43%);display:flex;flex-direction:column;gap:6px;font-size:16px}
        .planet-item{display:flex;align-items:center;min-height:20px}
        .planet-item.active{font-size:18px;font-weight:700;gap:8px}
        .planet-item.active:before{content:'';width:16px;height:16px;border-radius:50%;background:#fff}

.portal-wrap{left:50%;top:50%;width:min(320px,31vw);transform:translate(-50%,-54%);perspective:none}
        .portal-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:16px;opacity:0}
        .portal-heading strong{font-size:18px;margin-left:8px}
        .portal{position:relative;display:block;width:100%;aspect-ratio:320/350;padding:0;overflow:visible;border:0;
                border-radius:90px;background:transparent;cursor:pointer;box-shadow:none;transform:none!important}
        .portal video,.portal img{visibility:hidden;position:absolute;width:1px;height:1px;pointer-events:none}
        .portal-canvas{position:fixed;inset:0;z-index:3;width:100%;height:100%;pointer-events:none}


.planet-content{left:clamp(28px,4vw,58px);right:clamp(28px,3vw,44px);bottom:clamp(24px,3vh,30px);
                        display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
        .planet-content h1{font-family:Aalto,'Arial Narrow',sans-serif;font-size:clamp(128px,21.8vw,314px);
          font-weight:400;line-height:.72;margin:0 0 -.04em;letter-spacing:0;transform:translateX(-32px);opacity:0}
        .planet-content dl{width:min(447px,34vw);margin:0;font-size:16px}
        .fact{display:grid;grid-template-columns:138px 1fr;gap:18px;padding:8px 0;
              border-bottom:1px solid rgba(255,255,255,.48);opacity:0}
        .fact:last-child{border-bottom:0} .fact dt{font-weight:700} .fact dd{margin:0}

.transition-layer{display:none} .scene-canvas{display:none}
        .loading{position:absolute;z-index:12;left:50%;bottom:30px;transform:translateX(-50%);opacity:0;
                 font-size:12px;letter-spacing:.14em;text-transform:uppercase;transition:opacity .2s}
        .experience.is-loading .loading{opacity:.8}
        .experience.is-transitioning .header,.experience.is-transitioning .planet-list{opacity:1;filter:none;pointer-events:auto}
        .experience.is-transitioning .shade{opacity:1}
        .experience.is-committing .background{transition:none!important}
.preloader{position:absolute;inset:0;z-index:20;background:#000;overflow:hidden}
.preloader video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.preloader-shade{position:absolute;inset:auto 0 0;height:35%;background:linear-gradient(to bottom,transparent,#000)}
.preloader.is-background{z-index:0} .preloader.is-background .preloader-shade{opacity:0}
.floating-logo{position:fixed;z-index:22;left:50%;top:50%;width:59px;height:58px;transform:translate(-50%,-50%);
  will-change:left,top,width,height,transform;
  transition:left 2s cubic-bezier(.16,1,.3,1),top 2s cubic-bezier(.16,1,.3,1),width 2s cubic-bezier(.16,1,.3,1),height 2s cubic-bezier(.16,1,.3,1),transform 2s cubic-bezier(.16,1,.3,1)}
.floating-logo.is-docked{left:clamp(18px,1.95vw,28px);top:clamp(18px,3.1vh,28px);width:37px;height:36px;transform:none}
.floating-logo.is-settled{z-index:5}
.preloader-count{position:fixed;z-index:22;left:50%;bottom:clamp(22px,3.1vh,28px);display:flex;align-items:flex-end;
  gap:4px;transform:translateX(-50%);font-family:'SF Pro',Arial,sans-serif;line-height:1}
.preloader-count>span:first-child{font-family:'SF Pro Thin','SF Pro',Arial,sans-serif;font-size:64px;font-weight:100}
.preloader-count .percent{font-size:24px;padding-bottom:4px}
.preloader-count.is-leaving{animation:preload-count-out .75s cubic-bezier(.22,1,.36,1) both}
@keyframes preload-count-out{to{opacity:0;filter:blur(7px);transform:translate(-50%,-34px)}}
body:not(.preload-complete) .custom-cursor{opacity:0!important}
html,body,button,a,.portal{cursor:none!important}
.custom-cursor{display:block;position:fixed;left:0;top:0;z-index:100;width:1px;height:1px;
  pointer-events:none;opacity:0;transition:opacity .2s ease}
.custom-cursor.is-visible{opacity:1}
.cursor-dot,.cursor-orbit{position:absolute;left:0;top:0;border-radius:50%;transform:translate(-50%,-50%)}
.cursor-dot{width:12px;height:12px;background:#fff}
.cursor-orbit{width:36px;height:36px;border:1px solid #fff;background:rgba(255,255,255,.4);
  transition:transform .3s cubic-bezier(.22,1,.36,1)}
.custom-cursor.is-enter .cursor-orbit{transform:translate(-50%,-50%) scale(1.16)}
.cursor-label{position:absolute;top:26px;left:0;transform:translateX(-50%) translateY(-4px);
  font:16px/1.2 'SF Pro',Arial,sans-serif;white-space:nowrap;opacity:0;
  transition:opacity .2s ease,transform .3s cubic-bezier(.22,1,.36,1)}
.custom-cursor.is-enter .cursor-label{opacity:1;transform:translateX(-50%) translateY(0)}body:not(.intro-ready) .header,.planet-list,.planet-content h1,.planet-content .fact{opacity:0}
.intro-ready .header       { animation:reveal-down .9s cubic-bezier(.22,1,.36,1) .1s both }
.intro-ready .planet-list  { animation:reveal-side .9s cubic-bezier(.22,1,.36,1) .65s both }
.content-revealing h1      { animation:title-rise 1.05s cubic-bezier(.16,1,.3,1) both }
.content-revealing .fact   { animation:fact-rise .72s cubic-bezier(.22,1,.36,1) both }

.mask-revealing .portal-heading { animation:portal-caption .85s cubic-bezier(.22,1,.36,1) both }
.planet-list.is-switching .planet-item { animation:menu-row .58s cubic-bezier(.22,1,.36,1) both }

.planet-list.is-switching .planet-item.active:before { animation:active-dot .55s cubic-bezier(.22,1,.36,1) .18s both }

@keyframes reveal-down   {from{opacity:0;filter:blur(8px);transform:translateY(-18px)}      to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes reveal-side   {from{opacity:0;filter:blur(8px);transform:translate(-20px,-43%)}  to{opacity:1;filter:blur(0);transform:translate(0,-43%)}}
@keyframes title-rise    {from{opacity:0;filter:blur(12px);transform:translate(-32px,42px)} to{opacity:1;filter:blur(0);transform:translate(-32px,0)}}
@keyframes fact-rise     {from{opacity:0;filter:blur(7px);transform:translateY(18px)}       to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes portal-caption{from{opacity:0;filter:blur(7px);transform:translateY(22px)}       to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes menu-row      {from{opacity:.35;transform:translateX(-8px)}                      to{opacity:1;transform:translateX(0)}}
@keyframes active-dot    {from{opacity:0;transform:scale(0)}                                to{opacity:1;transform:scale(1)}}

.content-revealing .fact:nth-child(1){animation-delay:0.52s}
.content-revealing .fact:nth-child(2){animation-delay:0.68s}
.content-revealing .fact:nth-child(3){animation-delay:0.84s}
.content-revealing .fact:nth-child(4){animation-delay:1s}
.planet-list.is-switching .planet-item:nth-child(1){animation-delay:0.02s}
.planet-list.is-switching .planet-item:nth-child(2){animation-delay:0.05s}
.planet-list.is-switching .planet-item:nth-child(3){animation-delay:0.08s}
.planet-list.is-switching .planet-item:nth-child(4){animation-delay:0.11s}
.planet-list.is-switching .planet-item:nth-child(5){animation-delay:0.14s}
.planet-list.is-switching .planet-item:nth-child(6){animation-delay:0.17s}
.planet-list.is-switching .planet-item:nth-child(7){animation-delay:0.2s}
.planet-list.is-switching .planet-item:nth-child(8){animation-delay:0.23s}@media(max-width:900px){
  .nav{display:none}
  .portal-wrap{width:min(300px,48vw)}
  .planet-content h1{font-size:clamp(105px,24vw,190px)}
  .planet-content dl{width:43vw}
  .fact{grid-template-columns:110px 1fr}
  .planet-list{font-size:14px} .planet-item.active{font-size:16px}
}
@media(max-width:640px){
  .experience{min-height:600px}
  .planet-list{display:none}
  .portal-wrap{top:44%;width:min(260px,66vw)}
  .planet-content{left:18px;right:18px;bottom:18px;display:block}
  .planet-content h1{font-size:clamp(98px,30vw,160px);margin-bottom:20px}
  .planet-content dl{width:100%;font-size:13px}
  .fact{grid-template-columns:92px 1fr;padding:5px 0}
  .portal-heading{font-size:14px} .portal-heading strong{font-size:16px}
  .menu{height:38px} .portal{border-radius:70px}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}.portal{transform:none!important}}
button{font:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid white;outline-offset:5px}
.brand-name{margin-left:50px;font-size:18px;font-weight:700;letter-spacing:-.04em;white-space:nowrap}
.nav{-webkit-backdrop-filter:blur(12px)}
.nav.is-closed{display:none}
.planet-content dl{flex:none}
.planet-content h1{transform-origin:left bottom;white-space:nowrap;zoom:var(--title-fit,1)}
.preloader.is-unavailable{display:none}
.preloader.is-background{pointer-events:none}
.loading{pointer-events:none}
@media(max-width:900px){.nav.is-open{display:flex;position:absolute;right:0;top:52px}}
@media(max-width:640px){
  .planet-content h1{margin-left:32px}
}
@media(max-width:640px) and (max-height:740px){
  .experience{min-height:100%}
  .portal-wrap{top:37%;width:min(200px,52vw,28vh)}
  .planet-content h1{font-size:clamp(68px,22vw,100px);margin-bottom:14px}
  .planet-content dl{font-size:12px}
  .fact{padding:4px 0}
}
@media(hover:none),(pointer:coarse){html,body,button,a,.portal{cursor:auto!important}.custom-cursor{display:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0ms!important}}

</style>
</head>
<body>
<main class="experience" data-planet="mars">
  <div class="backgrounds" aria-hidden="true">
    <video id="mars-background"  class="background is-visible" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4" muted playsinline preload="auto"></video>
    <video id="earth-background" class="background"            src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4" muted playsinline preload="auto"></video>
    <video id="venus-background" class="background"            src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/b30f64d9-1637-477a-83df-d0fc6461a422.mp4" muted playsinline preload="auto"></video>
  </div>
  <div class="preloader" id="preloader" aria-label="Loading Mars">
    <video id="preloader-video" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/5fc5651c-3b5d-4171-b507-87f7e635d1b4.mp4" muted playsinline preload="auto"></video>
    <div class="preloader-shade"></div>
  </div>
  <img class="floating-logo" id="floating-logo" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/eb7e0f53-50cd-4af5-abc4-8b9a52cdc01b.svg" alt="Hey World">
  <div class="preloader-count" id="preloader-count" aria-live="polite">
    <span id="preloader-value">0</span><span class="percent">%</span>
  </div>
  <canvas id="scene-canvas" class="scene-canvas" aria-hidden="true"></canvas>
  <div class="shade" aria-hidden="true"></div>

  <header class="header chrome">
    <span class="brand-name">Hey World</span>
    <div class="header-actions">
      <nav class="nav" id="primary-nav" aria-label="Primary navigation">
        <a class="active" href="#about">About</a><a href="#explore">Explore</a><a href="#planets">Planets</a>
      </nav>
      <button class="menu" type="button" aria-controls="primary-nav" aria-expanded="false">Menu</button>
    </div>
  </header>

  <aside class="planet-list chrome" aria-label="Planets"></aside>

  <canvas id="portal-canvas" class="portal-canvas" aria-hidden="true"></canvas>
  <section class="portal-wrap chrome" aria-label="Next destination">
    <div class="portal-heading">
      <span>Next:</span>
      <span><span id="next-number">[03]</span> <strong id="next-name">Earth</strong></span>
    </div>
    <button class="portal" id="portal" type="button" aria-label="Travel to Earth">
      <video id="portal-video" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4" muted playsinline preload="auto"></video>
      <img id="portal-image" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg" alt="Mercury">
    </button>
  </section>

  <section class="planet-content chrome" aria-live="polite">
    <h1 id="planet-title">MARS</h1>
    <dl id="facts"></dl>
  </section>

  <div class="transition-layer" aria-hidden="true"><video id="transition-video" muted playsinline preload="auto"></video></div>
  <div class="loading" aria-hidden="true">Preparing orbit…</div>
  <div class="custom-cursor" aria-hidden="true">
    <span class="cursor-orbit"></span><span class="cursor-dot"></span><span class="cursor-label">Enter</span>
  </div>
</main>
<script>

(() => {
  'use strict';
  const BASE='https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P';
  const TO_EARTH=BASE+'/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4';
  const TO_VENUS=BASE+'/b30f64d9-1637-477a-83df-d0fc6461a422.mp4';
  const MERCURY=BASE+'/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg';
  const planets=['Mercury','Venus','Earth','Mars','Jupiter','Saturn','Uranus','Neptune'];
  const states={
    mars:{name:'Mars',next:'Earth',number:'[03]',portal:TO_EARTH,background:'mars-background',facts:[
      ['Distance:','About 228 million km (1.5 astronomical units).'],
      ['Year:','One Martian year is equal to 687 Earth days.'],
      ['Temperature:','Around -60 °C, dropping to -125 °C at the poles in winter.'],
      ['Atmosphere:','Very thin, consisting of 95% carbon dioxide, with frequent dust storms.']]},
    earth:{name:'Earth',next:'Venus',number:'[02]',portal:TO_VENUS,background:'earth-background',facts:[
      ['Distance:','149.6 million km from the Sun.'],['Year:','365.25 Earth days.'],
      ['Temperature:','Average surface temperature around 15 °C.'],
      ['Atmosphere:','Mostly nitrogen and oxygen, supporting life and liquid water.']]},
    venus:{name:'Venus',next:'Mercury',number:'[06]',image:MERCURY,background:'venus-background',facts:[
      ['Distance:','108.2 million km from the Sun.'],['Year:','225 Earth days.'],
      ['Temperature:','Around 465 °C — the hottest planet in the Solar System.'],
      ['Atmosphere:','Extremely dense, mostly carbon dioxide, with clouds of sulfuric acid.']]}
  };
  const $=selector=>document.querySelector(selector);
  const experience=$('.experience'),portal=$('#portal'),portalVideo=$('#portal-video');
  const portalImage=$('#portal-image'),transitionVideo=$('#transition-video');
  const canvas=$('#portal-canvas'),sceneCanvas=$('#scene-canvas');
  const ctx=canvas.getContext('2d'),sceneCtx=sceneCanvas.getContext('2d');
  const cursor=$('.custom-cursor'),motion=matchMedia('(prefers-reduced-motion: reduce)');
  const finePointer=matchMedia('(hover: hover) and (pointer: fine)');
  let current='mars',busy=true,hasRendered=false,transitionActive=false,frozenScene=false;
  let expansion=0,maskScale=0,canvasOpacity=1,targetX=0,targetY=0,rotX=0,rotY=0;
  let pointerX=innerWidth/2,pointerY=innerHeight/2,cursorX=pointerX,cursorY=pointerY,previousTime=0;
  const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const frame=()=>new Promise(resolve=>requestAnimationFrame(resolve));
  function retrigger(element,name){element.classList.remove(name);void element.offsetWidth;element.classList.add(name)}

  function fitTitle(){
    const title=$('#planet-title'),content=$('.planet-content'),facts=$('#facts');
    title.style.setProperty('--title-fit',1);
    const mobile=innerWidth<=640;
    const available=content.clientWidth-(mobile?0:facts.offsetWidth+40);
    const width=title.getBoundingClientRect().width;
    title.style.setProperty('--title-fit',Math.min(1,Math.max(0.35,available/width)));
  }

  function render(){
    const state=states[current];experience.dataset.planet=current;
    $('#planet-title').textContent=state.name.toUpperCase();
    $('#next-name').textContent=state.next;$('#next-number').textContent=state.number;
    portal.setAttribute('aria-label','Travel to '+state.next);
    portal.setAttribute('aria-disabled',String(current==='venus'));
    $('#facts').replaceChildren(...state.facts.map(([key,value])=>{
      const fact=document.createElement('div'),dt=document.createElement('dt'),dd=document.createElement('dd');
      fact.className='fact';dt.textContent=key;dd.textContent=value;fact.append(dt,dd);return fact;
    }));
    const list=$('.planet-list');
    list.replaceChildren(...planets.map(name=>{
      const item=document.createElement('span');item.className='planet-item'+(name===state.name?' active':'');
      item.textContent=name;if(name===state.name)item.setAttribute('aria-current','true');return item;
    }));
    if(hasRendered)retrigger(list,'is-switching');hasRendered=true;
    document.querySelectorAll('.background').forEach(v=>{v.classList.toggle('is-visible',v.id===state.background);v.pause()});
    portalImage.hidden=!state.image;portalVideo.hidden=Boolean(state.image);
    if(state.image){portalImage.src=state.image;portalVideo.pause()}
    else{
      if(portalVideo.getAttribute('src')!==state.portal){portalVideo.src=state.portal;portalVideo.load()}
      if(!motion.matches)portalVideo.play().catch(()=>{});else portalVideo.pause();
    }
    cursor.classList.remove('is-enter');fitTitle();
  }

  function mediaReady(media,timeout=6000,event='canplay'){
    const image=media instanceof HTMLImageElement;
    if(image?media.complete&&media.naturalWidth>0:media.readyState>=(event==='canplaythrough'?4:2))return Promise.resolve(true);
    return new Promise(resolve=>{
      const readyEvent=image?'load':event;let timer;
      const finish=ready=>{clearTimeout(timer);media.removeEventListener(readyEvent,onReady);media.removeEventListener('error',onError);resolve(ready)};
      const onReady=()=>finish(true),onError=()=>finish(false);
      media.addEventListener(readyEvent,onReady,{once:true});media.addEventListener('error',onError,{once:true});
      timer=setTimeout(()=>finish(false),timeout);
    });
  }

  function resizeCanvas(){
    const d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;
    canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0);
    if(!frozenScene){
      sceneCanvas.width=innerWidth*d;sceneCanvas.height=innerHeight*d;
      sceneCanvas.style.width=innerWidth+'px';sceneCanvas.style.height=innerHeight+'px';sceneCtx.setTransform(d,0,0,d,0,0);
    }
  }
  function drawCover(context,media){
    const mw=media.videoWidth||media.naturalWidth,mh=media.videoHeight||media.naturalHeight;
    if(!mw||!mh||(media instanceof HTMLVideoElement&&media.readyState<2))return false;
    const scale=Math.max(innerWidth/mw,innerHeight/mh),w=mw*scale,h=mh*scale;
    context.drawImage(media,(innerWidth-w)/2,(innerHeight-h)/2,w,h);return true;
  }
  function drawShade(context){
    const gradient=context.createLinearGradient(0,innerHeight*.52,0,innerHeight);
    gradient.addColorStop(0,'rgba(0,0,0,0)');gradient.addColorStop(1,'rgba(0,0,0,.88)');
    context.fillStyle=gradient;context.fillRect(0,innerHeight*.52,innerWidth,innerHeight*.48);
  }
  function projectedPath(w,h,radius,rx,ry,cx,cy){
    const r=Math.min(radius,w/2,h/2),ax=rx*Math.PI/180,ay=ry*Math.PI/180;
    const corners=[[w/2-r,-h/2+r,-Math.PI/2,0],[w/2-r,h/2-r,0,Math.PI/2],[-w/2+r,h/2-r,Math.PI/2,Math.PI],[-w/2+r,-h/2+r,Math.PI,Math.PI*1.5]];
    ctx.beginPath();
    corners.forEach(([x0,y0,from,to],corner)=>{
      for(let step=0;step<=10;step++){
        const angle=from+(to-from)*step/10,x=x0+Math.cos(angle)*r,y=y0+Math.sin(angle)*r;
        const xx=x*Math.cos(ay),yy=y*Math.cos(ax),z=x*Math.sin(ay)-y*Math.sin(ax),p=850/(850+z);
        if(corner===0&&step===0)ctx.moveTo(cx+xx*p,cy+yy*p);else ctx.lineTo(cx+xx*p,cy+yy*p);
      }
    });ctx.closePath();
  }
  function draw(time){
    const dt=Math.min(40,previousTime?time-previousTime:16.67);previousTime=time;
    rotX+=(targetX-rotX)*Math.min(1,dt*.009);rotY+=(targetY-rotY)*Math.min(1,dt*.009);
    ctx.clearRect(0,0,innerWidth,innerHeight);
    if(frozenScene){ctx.drawImage(sceneCanvas,0,0,innerWidth,innerHeight);drawShade(ctx)}
    const rect=portal.getBoundingClientRect(),e=expansion,rectCx=rect.left+rect.width/2,rectCy=rect.top+rect.height/2;
    const cx=rectCx+(innerWidth/2-rectCx)*e,cy=rectCy+(innerHeight/2-rectCy)*e;
    const scale=e?1:maskScale,w=(rect.width+(innerWidth-rect.width)*e)*scale,h=(rect.height+(innerHeight-rect.height)*e)*scale;
    if(w>1&&h>1){
      projectedPath(w,h,90*(1-e)*scale,rotX*(1-e),rotY*(1-e),cx,cy);
      ctx.save();ctx.globalAlpha=canvasOpacity;ctx.clip();ctx.fillStyle='#030303';ctx.fillRect(0,0,innerWidth,innerHeight);
      drawCover(ctx,transitionActive?transitionVideo:(states[current].image?portalImage:portalVideo));
      if(transitionActive)drawShade(ctx);ctx.restore();
    }requestAnimationFrame(draw);
  }
  function animateValue(setter,duration){
    if(motion.matches){setter(1);return Promise.resolve()}
    return new Promise(resolve=>{
      const start=performance.now();
      function tick(time){const t=Math.min(1,(time-start)/duration);setter(t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2);
        if(t<1&&!motion.matches)requestAnimationFrame(tick);else{setter(1);resolve()}}
      requestAnimationFrame(tick);
    });
  }
  function revealMask(){retrigger(experience,'mask-revealing');maskScale=0;return animateValue(v=>{maskScale=v},1050)}
  function revealPlanetContent(){retrigger(experience,'content-revealing')}
  async function startExperience(){
    await mediaReady(states[current].image?portalImage:portalVideo);await revealMask();document.body.classList.add('intro-ready');
    await pause(motion.matches?0:850);revealPlanetContent();busy=false;
  }
  function videoFinished(video){
    let cancel;const promise=new Promise(resolve=>{
      const duration=Number.isFinite(video.duration)?video.duration:12;let timer;
      const finish=ok=>{clearTimeout(timer);video.removeEventListener('ended',ended);video.removeEventListener('error',error);resolve(ok)};
      const ended=()=>finish(true),error=()=>finish(false);cancel=()=>finish(false);
      video.addEventListener('ended',ended,{once:true});video.addEventListener('error',error,{once:true});
      timer=setTimeout(()=>finish(false),duration/1.3*1000+4000);
    });return{promise,cancel:()=>cancel()};
  }
  async function holdFinalFrame(video){
    if(!Number.isFinite(video.duration))return;
    await new Promise(resolve=>{
      const timer=setTimeout(done,1600);
      function done(){clearTimeout(timer);video.removeEventListener('seeked',done);resolve()}
      video.addEventListener('seeked',done,{once:true});video.currentTime=Math.max(0,video.duration-.04);
    });
  }
  async function travel(){
    if(busy||current==='venus')return;busy=true;targetX=targetY=0;cursor.classList.remove('is-enter');
    const next=current==='mars'?'earth':'venus';let completion;
    try{
      transitionVideo.src=states[current].portal;transitionVideo.load();experience.classList.add('is-loading');
      await mediaReady(transitionVideo,1600,'canplaythrough');
      experience.classList.remove('is-loading','content-revealing','mask-revealing');experience.classList.add('is-transitioning');
      transitionVideo.currentTime=0;transitionVideo.playbackRate=1.3;canvasOpacity=1;transitionActive=true;
      if(motion.matches){
        await mediaReady(transitionVideo,4000);if(transitionVideo.readyState<2)throw new Error('Destination unavailable');
        await holdFinalFrame(transitionVideo);expansion=1;
      }else{
        completion=videoFinished(transitionVideo);
        await Promise.race([transitionVideo.play(),completion.promise.then(ok=>{if(!ok)throw new Error('Destination video did not start')})]);
        await animateValue(v=>{expansion=v},1100);if(!await completion.promise)throw new Error('Destination video did not finish');
      }
      frozenScene=false;resizeCanvas();sceneCtx.clearRect(0,0,innerWidth,innerHeight);frozenScene=drawCover(sceneCtx,transitionVideo);
      current=next;experience.classList.add('is-committing');render();await frame();await frame();
      transitionActive=false;expansion=0;maskScale=0;canvasOpacity=1;experience.classList.remove('is-transitioning','is-committing');
      const maskReveal=revealMask();setTimeout(revealPlanetContent,motion.matches?0:100);await maskReveal;await pause(motion.matches?0:450);
    }catch{
      transitionActive=false;expansion=0;maskScale=1;canvasOpacity=1;experience.classList.remove('is-loading','is-transitioning','is-committing');
      retrigger(experience,'mask-revealing');revealPlanetContent();
    }finally{
      if(completion)completion.cancel();transitionVideo.pause();transitionVideo.removeAttribute('src');transitionVideo.load();busy=false;
    }
  }
  function runPreloader(){
    const video=$('#preloader-video'),preloader=$('#preloader'),counter=$('#preloader-count'),value=$('#preloader-value'),logo=$('#floating-logo');
    let finished=false,started=false;const safetyTimer=setTimeout(finish,12000);
    function finish(){
      if(finished)return;finished=true;clearTimeout(safetyTimer);video.pause();value.textContent='100';counter.classList.add('is-leaving');
      logo.classList.add('is-docked');preloader.classList.add('is-background');if(video.readyState<2)preloader.classList.add('is-unavailable');
      document.body.classList.add('preload-complete');startExperience();setTimeout(()=>counter.remove(),750);setTimeout(()=>logo.classList.add('is-settled'),2000);
    }
    function play(){
      if(started||finished)return;started=true;if(motion.matches||!Number.isFinite(video.duration)){finish();return}
      video.playbackRate=Math.max(.25,video.duration/3);video.play().catch(finish);
    }
    function update(){if(finished)return;if(Number.isFinite(video.duration)&&video.duration>0)value.textContent=String(Math.round(video.currentTime/video.duration*100));requestAnimationFrame(update)}
    video.addEventListener('ended',finish,{once:true});video.addEventListener('error',finish,{once:true});video.addEventListener('loadedmetadata',play,{once:true});
    if(video.readyState>=1)play();if(motion.matches)finish();requestAnimationFrame(update);
  }
  function cursorLoop(){
    const smoothing=motion.matches?1:.2;cursorX+=(pointerX-cursorX)*smoothing;cursorY+=(pointerY-cursorY)*smoothing;
    cursor.style.transform='translate3d('+cursorX+'px,'+cursorY+'px,0)';requestAnimationFrame(cursorLoop);
  }
  document.addEventListener('pointermove',event=>{
    if(!finePointer.matches||event.pointerType==='touch')return;pointerX=event.clientX;pointerY=event.clientY;cursor.classList.add('is-visible');
    if(busy||motion.matches)return;targetY=(event.clientX/innerWidth-.5)*37.4;targetX=(event.clientY/innerHeight-.5)*-33;
  });
  const leavePointer=()=>{targetX=targetY=0;cursor.classList.remove('is-visible','is-enter')};
  document.addEventListener('mouseleave',leavePointer);document.documentElement.addEventListener('pointerleave',leavePointer);
  portal.addEventListener('pointerenter',()=>{if(!busy&&current!=='venus'&&finePointer.matches)cursor.classList.add('is-enter')});
  portal.addEventListener('pointerleave',()=>cursor.classList.remove('is-enter'));portal.addEventListener('click',travel);
  window.addEventListener('resize',()=>{resizeCanvas();fitTitle()});
  document.fonts.ready.then(fitTitle);
  motion.addEventListener('change',()=>{targetX=targetY=rotX=rotY=0;if(motion.matches)portalVideo.pause();else if(!states[current].image)portalVideo.play().catch(()=>{})});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)portalVideo.pause();else if(!motion.matches&&!states[current].image)portalVideo.play().catch(()=>{})});
  const menu=$('.menu'),nav=$('.nav'),narrowMenu=matchMedia('(max-width: 900px)');
  function setMenu(open){nav.classList.toggle('is-open',open);nav.classList.toggle('is-closed',!open);menu.setAttribute('aria-expanded',String(open))}
  setMenu(!narrowMenu.matches);menu.addEventListener('click',()=>setMenu(menu.getAttribute('aria-expanded')!=='true'));
  narrowMenu.addEventListener('change',event=>setMenu(!event.matches));
  nav.addEventListener('click',event=>{
    const link=event.target.closest('a');if(!link)return;event.preventDefault();
    nav.querySelectorAll('a').forEach(item=>item.classList.toggle('active',item===link));if(narrowMenu.matches)setMenu(false);
    if(link.hash==='#explore')portal.focus({preventScroll:true});
  });
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&narrowMenu.matches&&menu.getAttribute('aria-expanded')==='true'){setMenu(false);menu.focus()}});
  portalVideo.loop=true;
  document.querySelectorAll('.background').forEach(video=>{video.pause();video.currentTime=0});
  resizeCanvas();render();requestAnimationFrame(draw);requestAnimationFrame(cursorLoop);runPreloader();
})();

</script>
</body>
